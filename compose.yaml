services:
  web:
    build: .
    image: travelcanary:local
    command: npm run start:container
    init: true
    restart: unless-stopped
    environment:
      TRAVELCANARY_RUNTIME: local
      TRAVELCANARY_PUBLIC_DATA_DIR: /data/public
      PORT: "3000"
    ports:
      - "127.0.0.1:${TRAVELCANARY_PORT:-3000}:3000"
    volumes:
      - travelcanary-public:/data/public:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  collector:
    image: travelcanary:local
    command: ["node", "--import", "tsx", "scripts/collector.ts"]
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TRAVELCANARY_RUNTIME: local
      TRAVELCANARY_PRIVATE_DATA_DIR: /data/private
      TRAVELCANARY_PUBLIC_DATA_DIR: /data/public
      TRAVELCANARY_CACHE_DIR: /data/cache
      LOCAL_CONDITIONS_ENABLED: "true"
    volumes:
      - travelcanary-private:/data/private
      - travelcanary-public:/data/public
      - travelcanary-cache:/data/cache
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  collector-once:
    image: travelcanary:local
    command: npm run collector:once
    profiles: ["tools"]
    init: true
    environment:
      TRAVELCANARY_RUNTIME: local
      TRAVELCANARY_PRIVATE_DATA_DIR: /data/private
      TRAVELCANARY_PUBLIC_DATA_DIR: /data/public
      TRAVELCANARY_CACHE_DIR: /data/cache
      LOCAL_CONDITIONS_ENABLED: "true"
    volumes:
      - travelcanary-private:/data/private
      - travelcanary-public:/data/public
      - travelcanary-cache:/data/cache
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  travelcanary-private:
  travelcanary-public:
  travelcanary-cache:
