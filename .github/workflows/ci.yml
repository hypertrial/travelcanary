name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci --no-audit --no-fund
      - run: npm run check:fast

  self-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run tests/unit/local-storage.test.ts tests/unit/local-api.test.ts tests/unit/native-setup.test.ts
      - run: npm run omarchy:check
      - run: npm run build
        env:
          TRAVELCANARY_RUNTIME: local
          LOCAL_CONDITIONS_ENABLED: "true"
      - run: docker compose config --quiet
      - run: docker build --tag travelcanary:ci .
      - name: Smoke test generated systemd services
        run: |
          set -euo pipefail
          node --import tsx scripts/render-systemd-smoke.ts
          unit_dir="$RUNNER_TEMP/travelcanary-systemd-home/.config/systemd/user"
          systemd-analyze verify "$unit_dir/travelcanary-web.service" "$unit_dir/travelcanary-collector.service"
          sudo systemctl link "$unit_dir/travelcanary-web.service" "$unit_dir/travelcanary-collector.service"
          sudo systemctl daemon-reload
          trap 'sudo systemctl stop travelcanary-web.service travelcanary-collector.service || true' EXIT
          sudo systemctl start travelcanary-web.service travelcanary-collector.service
          if ! curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:3199/api/healthz; then
            sudo systemctl status travelcanary-web.service travelcanary-collector.service --no-pager || true
            sudo journalctl -u travelcanary-web.service -u travelcanary-collector.service --no-pager -n 100 || true
            exit 1
          fi
          sudo systemctl is-active travelcanary-web.service travelcanary-collector.service
